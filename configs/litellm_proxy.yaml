# litellm proxy config: routes two named models to two separate mlx_lm.server
# backends (root and worker each serve one model on their own port). RLM's own
# api_base is a single value per run, so this proxy is what lets root/worker
# resolve to different local servers under one endpoint.
model_list:
  - model_name: qwen35-root
    litellm_params:
      model: openai/mlx-community/Qwen3.5-35B-A3B-4bit
      api_base: http://localhost:8011/v1
      api_key: "not-needed"
  - model_name: qwen35-worker
    litellm_params:
      model: openai/mlx-community/Qwen3.5-2B-bf16
      api_base: http://localhost:8002/v1
      api_key: "not-needed"

general_settings:
  port: 4000

# Each model above has exactly ONE deployment (one mlx_lm.server instance),
# no redundant backup to fall back to. litellm's default deployment-cooldown
# behavior (meant for multi-deployment setups) blacklists the sole deployment
# after a single transient failure/timeout, so every subsequent request fails
# immediately with RateLimitError/NotFoundError ("no deployments available")
# even though the backend is healthy -- a cascading failure with no recovery.
# Disabling cooldowns is correct here since there's nothing to fail over to.
router_settings:
  disable_cooldowns: true
  allowed_fails: 999999
  cooldown_time: 0
