# Reranker-RLM: only Stage 1 (cosine prefilter + cross-encoder reranker) active.
# Always recurses (router off), irrelevant chunks are filtered from the root,
# no adaptive stopping.
name: reranker_rlm
mode: gate
models:
  root: openai/qwen35-root
  worker: openai/qwen35-worker
router: {enabled: false}
relevance: {enabled: true, filter_irrelevant: true}
stopping: {enabled: false}
