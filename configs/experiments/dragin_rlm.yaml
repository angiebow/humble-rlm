# DRAGIN-RLM: RIND-gated generation with QFS-sliced worker sub-calls (see
# src/dragin_rlm/harness.py). Different shape from the other conditions' configs:
# the root model here is loaded directly via mlx-lm (attention_probe.py), not
# addressed through the litellm proxy, because RIND needs per-token attention
# that the REST bridge can't expose. Run with experiments/run_dragin.py, not
# experiments/run.py -- see that script's docstring for why (this needs one
# long-lived process holding the model, not --workers fan-out).
name: dragin_rlm
mode: dragin
models:
  worker: openai/qwen35-worker   # sub-call answering over a QFS-selected slice; regular litellm/REST
dragin:
  model_path: "mlx-community/Qwen3.5-35B-A3B-4bit"  # root; loaded directly, no litellm alias
  theta: 0.0001          # [SWEEP] RIND trigger threshold. Paper Table 9 suggests 0.6-1.5,
                          # but that's calibrated on ~200-1500-token contexts (Wikipedia
                          # passages, generate_length 64-128); BrowseComp-Plus documents run
                          # to 80k+ tokens, and softmax attention weights (a_max, one factor
                          # of S_RIND) shrink with the number of competing key positions.
                          # Measured directly on a real 10-question sample10c diagnostic run
                          # (threshold_diagnostic.py): max S_RIND per question ranged
                          # 0.0013-0.0040 (p50=0.0028, p75=0.0031). theta=0.003 (p50-p75 line)
                          # only triggered on 4/10 questions and didn't move accuracy; lowered
                          # further to 0.0001 (below the observed min) to push retrieval rate
                          # toward "fires on nearly every question" and see whether accuracy
                          # responds at all at the high end of recursion frequency.
  top_n: 25              # QFS query length in tokens (paper Table 9: 25-35)
  generate_length: 768   # total root-token budget across all segments -- was 256;
                          # every question in the first 50-question sample50 run
                          # exhausted 256 without ever reaching "So the answer is:"
                          # (see DRAGIN_RLM_TEST_RESULTS.md), so accuracy there was
                          # dominated by truncated reasoning, not model correctness
  max_triggers: 8        # safety cap on retrieval count; the paper leaves this unbounded
  min_answer_tokens: 128 # guaranteed, trigger-immune budget for the final answer
                          # pass once max_triggers is reached -- fixes the theta=0.0001
                          # smoke test where every segment (including the last) got cut
                          # off after ~2 tokens, so both runs ended with a bare "<think>"
                          # and no answer at all (see DRAGIN_RLM_TEST_RESULTS.md)
  retrieval_top_k: 3     # passages handed to the worker per trigger
  passage_chars: 1000
  temperature: 0.0
