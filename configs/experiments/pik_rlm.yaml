# P(IK)-RLM: only Stage 0 (router) active. Direct-vs-recurse routing, no
# relevance gate, no adaptive stopping inside the recursion itself.
name: pik_rlm
mode: gate
models:
  root: openai/qwen35-root
  worker: openai/qwen35-worker
# probe_api_base bypasses litellm for the logprob probe -- mlx_lm.server's
# logprobs response has token:null, which fails litellm's strict response
# validation even though generation succeeds. Point this at whichever port
# scripts/start_mlx_local.sh binds the root server to.
router: {enabled: true, method: logprob, tau_route: 0.75, probe_api_base: "http://localhost:8011/v1"}
relevance: {enabled: false}
stopping: {enabled: false}
