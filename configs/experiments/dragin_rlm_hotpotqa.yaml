# DRAGIN-RLM for HotpotQA evaluation: local setup with no external dependencies.
# Uses local mlx_lm servers for both root and worker.
name: dragin_rlm_hotpotqa
mode: dragin
models:
  # Worker uses local mlx_lm.server on :8005 (separate from other tiers)
  worker: mlx-community/Qwen3.5-2B
dragin:
  # Root model: loaded directly, no external API
  model_path: "mlx-community/Qwen3.5-35B-A3B-4bit"
  # 0.01 is below the lowest per-question max RIND score seen on HotpotQA (0.010),
  # so retrieval should trigger on most questions. Earlier: 0.001 -> 20/20 retrievals
  # on every question (cap hit); 0.03 -> rarely; 100 -> never (no-retrieval baseline).
  theta: 0.01
  # Ignore RIND triggers in the first N tokens (no context yet, so the retrieval
  # query would be near-empty).
  min_prefix_tokens: 10
  top_n: 25
  generate_length: 768
  max_retrieval_seconds: 600
  max_triggers: 20
  retrieval_top_k: 3
  passage_chars: 1000
  temperature: 0.0
